name: Build and publish Typst document

on:
  push:
    branches:
      - main
    paths:
      - 'IanMcGillivaryResume.typ'

permissions:
  contents: read

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Typst
        uses: typst-community/setup-typst@v5

      - name: Compile Typst document
        run: typst compile IanMcGillivaryResume.typ IanMcGillivaryResume.pdf

      - name: Upload PDF to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT }}
          AWS_REGION: auto
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          aws s3 cp IanMcGillivaryResume.pdf "s3://${R2_BUCKET}/IanMcGillivaryResume.pdf" \
            --endpoint-url "${AWS_ENDPOINT_URL}" \
            --content-type "application/pdf"
